<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0, viewport-fit=cover">

    <meta name="theme-color" content="#080D22">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Cherry Academy">

    <title>Cherry Academy</title>

    <link rel="stylesheet" href="style.css">
    <link rel="manifest" href="manifest.json">
    <link rel="apple-touch-icon" href="icono.png">
</head>

<body>

    <!-- =========================
         PANTALLA DE INICIO
    ========================== -->

    <section id="pantalla-inicio" class="pantalla activa">

        <div class="inicio-contenedor">

            <div class="inicio-logo">
                <div class="logo-circulo">
                    🍒
                </div>
            </div>

            <p class="marca">
                CHERRY ACADEMY
            </p>

            <h1>
                CONTROL ESCOLAR
            </h1>

            <p class="subtitulo">
                Sistema de administración escolar
            </p>

            <button
                type="button"
                class="boton boton-principal boton-inicio"
                onclick="mostrarLogin()">
                INICIAR
            </button>

        </div>

    </section>


    <!-- =========================
         PANTALLA DE LOGIN
    ========================== -->

    <section id="pantalla-login" class="pantalla">

        <div class="login-contenedor">

            <div class="login-icono">
                🔐
            </div>

            <p class="marca">
                CHERRY ACADEMY
            </p>

            <h2>
                ACCESO AL SISTEMA
            </h2>

            <p>
                Ingresa tus datos para continuar
            </p>


            <!-- ID DEL USUARIO -->

            <input
                type="text"
                id="campo-id"
                class="campo"
                placeholder="ID de usuario"
                maxlength="30"
                autocomplete="off">


            <!-- PIN -->

            <input
                type="password"
                id="campo-pin"
                class="campo"
                placeholder="PIN"
                maxlength="4"
                inputmode="numeric"
                autocomplete="off">


            <p
                id="mensaje-login"
                class="mensaje-login">
            </p>


            <button
                type="button"
                class="boton boton-principal"
                onclick="validarAcceso()">
                ENTRAR
            </button>


            <button
                type="button"
                class="boton boton-secundario"
                onclick="mostrarInicio()">
                VOLVER
            </button>

        </div>

    </section>


    <!-- =========================
         MENÚ PRINCIPAL
    ========================== -->

    <section id="pantalla-menu" class="pantalla">

        <div class="menu-contenedor">

            <div class="encabezado-menu">

                <div>

                    <p class="marca">
                        🍒 CHERRY ACADEMY
                    </p>

                    <h1>
                        CONTROL ESCOLAR
                    </h1>

                    <p>
                        Menú principal
                    </p>

                    <!-- AQUÍ SE MOSTRARÁ EL USUARIO Y SU ROL -->

                    <div
                        id="usuario-info"
                        class="info-usuario">
                    </div>

                </div>


                <button
                    type="button"
                    class="boton boton-salir"
                    onclick="salirSistema()">
                    SALIR
                </button>

            </div>


            <!-- =========================
                 MÓDULOS
            ========================== -->

            <div class="grid-menu">


                <!-- ALUMNOS -->

                <button
                    type="button"
                    class="tarjeta-menu estudiantes"
                    onclick="abrirModulo('alumnos')">

                    <span class="numero">
                        01
                    </span>

                    <span class="icono">
                        🎓
                    </span>

                    <span class="nombre">
                        Alumnos
                    </span>

                </button>


                <!-- PROFESORES -->

                <button
                    type="button"
                    class="tarjeta-menu docentes"
                    onclick="abrirModulo('profesores')">

                    <span class="numero">
                        02
                    </span>

                    <span class="icono">
                        👩‍🏫
                    </span>

                    <span class="nombre">
                        Profesores
                    </span>

                </button>


                <!-- GRUPOS -->

                <button
                    type="button"
                    class="tarjeta-menu grupos"
                    onclick="abrirModulo('grupos')">

                    <span class="numero">
                        03
                    </span>

                    <span class="icono">
                        👥
                    </span>

                    <span class="nombre">
                        Grupos
                    </span>

                </button>


                <!-- MATERIAS -->

                <button
                    type="button"
                    class="tarjeta-menu materias"
                    onclick="abrirModulo('materias')">

                    <span class="numero">
                        04
                    </span>

                    <span class="icono">
                        📚
                    </span>

                    <span class="nombre">
                        Materias
                    </span>

                </button>


                <!-- CALIFICACIONES -->

                <button
                    type="button"
                    class="tarjeta-menu calificaciones"
                    onclick="abrirModulo('calificaciones')">

                    <span class="numero">
                        05
                    </span>

                    <span class="icono">
                        📊
                    </span>

                    <span class="nombre">
                        Calificaciones
                    </span>

                </button>


                <!-- ASISTENCIAS -->

                <button
                    type="button"
                    class="tarjeta-menu asistencias"
                    onclick="abrirModulo('asistencias')">

                    <span class="numero">
                        06
                    </span>

                    <span class="icono">
                        ✅
                    </span>

                    <span class="nombre">
                        Asistencias
                    </span>

                </button>


                <!-- TAREAS -->

                <button
                    type="button"
                    class="tarjeta-menu tareas"
                    onclick="abrirModulo('tareas')">

                    <span class="numero">
                        07
                    </span>

                    <span class="icono">
                        📝
                    </span>

                    <span class="nombre">
                        Tareas
                    </span>

                </button>


                <!-- REPORTES -->

                <button
                    type="button"
                    class="tarjeta-menu reportes"
                    onclick="abrirModulo('reportes')">

                    <span class="numero">
                        08
                    </span>

                    <span class="icono">
                        📄
                    </span>

                    <span class="nombre">
                        Reportes
                    </span>

                </button>

            </div>

        </div>

    </section>


    <!-- =========================
         PANTALLA DE MÓDULOS
    ========================== -->

    <section
        id="pantalla-modulo"
        class="pantalla">

        <div
            id="contenido-modulo"
            class="modulo-contenedor">
        </div>

    </section>


    <!-- =========================
         MODAL
    ========================== -->

    <div
        id="modal"
        class="modal oculto">

        <div class="modal-contenido">

            <button
                type="button"
                class="modal-cerrar"
                onclick="cerrarModal()">
                ×
            </button>


            <div class="modal-icono">
                🍒
            </div>


            <h2 id="modal-titulo">
                Cherry Academy
            </h2>


            <div id="modal-contenido">
            </div>


            <button
                type="button"
                class="boton boton-principal"
                onclick="cerrarModal()">
                ACEPTAR
            </button>

        </div>

    </div>


    <!-- =========================
         JAVASCRIPT
    ========================== -->

    <script src="app.js"></script>

</body>

</html>
